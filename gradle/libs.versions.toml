[versions]
agp = "9.5.2"
kotlin = "2.4.21"
kotlinxSerialization = "1.13.0"
composeBom = "2026.11.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
coreKtx = "1.17.0"
work = "2.11.0"
biometric = "1.2.0-alpha05"
shizuku = "13.1.5"
dhizuku = "2.5.4"
hiddenapibypass = "6.1"
libxposed = "102.0.0"
appiconloader = "1.5.0"
coroutines = "1.10.2"
junit = "4.13.2"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-biometric = { module = "androidx.biometric:biometric-ktx", version.ref = "biometric" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit4 = { module = "junit:junit", version.ref = "junit" }

# MIUIX OS4 —— 版本由 composite build（../miuix 源码）提供
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons" }
miuix-material = { module = "top.yukonga.miuix.kmp:miuix-material" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur" }
miuix-glass = { module = "top.yukonga.miuix.kmp:miuix-glass" }
miuix-glass-icons = { module = "top.yukonga.miuix.kmp:miuix-glass-icons" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav" }
miuix-squircle = { module = "top.yukonga.miuix.kmp:miuix-squircle" }

shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
dhizuku-api = { module = "io.github.iamr0s:Dhizuku-API", version.ref = "dhizuku" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
appiconloader = { module = "me.zhanghai.android.appiconloader:appiconloader", version.ref = "appiconloader" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
